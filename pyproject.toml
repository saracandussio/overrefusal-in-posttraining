[project]
name = "overrefusal"
version = "0.2.0"
description = "Over-refusal across the OLMo post-training pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8",
  "torch>=2.0", "transformers>=4.57", "accelerate>=0.27",
  "datasets>=2.18", "huggingface-hub>=0.23",
  "openai>=1.0", "httpx", "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
